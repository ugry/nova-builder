name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Non-blocking: repo has pre-existing prettier debt (src/blocks/*).
      # Developer agent should fix formatting, then devops makes lint required.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint:js
